<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Mijn blog</h1>
    <p>Alles wat ik leer over UX, design en code.</p>
  </header>

  <main>
    <section class="composer" aria-labelledby="composer-title">
      <h2 id="composer-title">Nieuw blogonderdeel</h2>
      <form id="post-form">
        <label>Titel
          <input id="title" type="text" required maxlength="80" placeholder="Bijv. Waarom knoppen groot moeten zijn">
        </label>
        <label>Tekst
          <textarea id="body" required rows="5" placeholder="Schrijf hier je stukje…"></textarea>
        </label>
        <fieldset>
          <legend>Voeg toe aan</legend>
          <label class="choice"><input type="radio" name="category" value="ux" checked> UX</label>
          <label class="choice"><input type="radio" name="category" value="design"> Design</label>
          <label class="choice"><input type="radio" name="category" value="code"> Code</label>
        </fieldset>
        <button type="submit">Toevoegen</button>
      </form>
    </section>

    <section class="board" aria-label="Blogonderdelen">
      <article class="column" data-cat="ux">
        <h2>UX <span class="count" id="count-ux">0</span></h2>
        <div class="list" id="list-ux"></div>
      </article>
      <article class="column" data-cat="design">
        <h2>Design <span class="count" id="count-design">0</span></h2>
        <div class="list" id="list-design"></div>
      </article>
      <article class="column" data-cat="code">
        <h2>Code <span class="count" id="count-code">0</span></h2>
        <div class="list" id="list-code"></div>
      </article>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
